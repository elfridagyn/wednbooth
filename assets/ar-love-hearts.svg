<svg xmlns="http://www.w3.org/2000/svg" width="500" height="100" viewBox="0 0 500 100">
  <defs>
    <linearGradient id="heartPink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff70b8"/>
      <stop offset=".52" stop-color="#ed278c"/>
      <stop offset="1" stop-color="#b91d72"/>
    </linearGradient>
    <linearGradient id="heartMagenta" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fa4ca6"/>
      <stop offset=".55" stop-color="#d91b82"/>
      <stop offset="1" stop-color="#96165c"/>
    </linearGradient>
    <linearGradient id="heartRose" x1="0" y1="0" x2=".9" y2="1">
      <stop offset="0" stop-color="#f178b5"/>
      <stop offset=".58" stop-color="#df438f"/>
      <stop offset="1" stop-color="#a82e72"/>
    </linearGradient>
    <linearGradient id="heartViolet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e95da8"/>
      <stop offset=".55" stop-color="#c92e83"/>
      <stop offset="1" stop-color="#81205f"/>
    </linearGradient>
    <linearGradient id="heartLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff8ac7"/>
      <stop offset=".58" stop-color="#ef4b9e"/>
      <stop offset="1" stop-color="#b92a76"/>
    </linearGradient>
    <filter id="softEdge" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur stdDeviation=".6"/>
    </filter>
    <path id="heart" d="M50 89 C44 83 13 60 8 41 C2 18 25 7 42 22 C46 25 49 29 50 32 C53 26 61 17 70 14 C91 7 104 25 97 43 C91 61 63 82 50 89Z"/>
