    <use href="#heart" transform="translate(103) scale(.9 1)" fill="url(#heartMagenta)"/>
    <use href="#heart" transform="translate(203) scale(.9 1)" fill="url(#heartRose)"/>
    <use href="#heart" transform="translate(303) scale(.9 1)" fill="url(#heartViolet)"/>
    <use href="#heart" transform="translate(403) scale(.9 1)" fill="url(#heartLight)"/>
